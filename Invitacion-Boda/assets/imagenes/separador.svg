<svg viewBox="0 0 400 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Línea recta central elegante (izquierda y derecha) -->
    <line x1="20" y1="30" x2="160" y2="30" stroke="#2c6b8c" stroke-width="1" stroke-linecap="round"/>
    <line x1="240" y1="30" x2="380" y2="30" stroke="#2c6b8c" stroke-width="1" stroke-linecap="round"/>

    <!-- Enredaderas y ramitas sutiles -->
    <path d="M 80 30 Q 100 16 125 24" fill="none" stroke="#789e82" stroke-width="1"/>
    <path d="M 320 30 Q 300 44 275 36" fill="none" stroke="#789e82" stroke-width="1"/>

    <!-- Hojas delicadas -->
    <path d="M 115 18 C 122 12 132 16 125 24 Z" fill="#789e82" opacity="0.85"/>
    <path d="M 285 42 C 278 48 268 44 275 36 Z" fill="#789e82" opacity="0.85"/>

    <!-- Flor Central Principal (Delicada, estilo botánico con pétalos estilizados) -->
    <g transform="translate(200, 30)">
        <!-- Pétalos en círculo rotados -->
        <ellipse cx="0" cy="-9" rx="3.5" ry="7.5" fill="#7ba4be" opacity="0.9"/>
        <ellipse cx="7.79" cy="-4.5" rx="3.5" ry="7.5" transform="rotate(60 7.79 -4.5)" fill="#5b92b0" opacity="0.9"/>
        <ellipse cx="7.79" cy="4.5" rx="3.5" ry="7.5" transform="rotate(120 7.79 4.5)" fill="#7ba4be" opacity="0.9"/>
        <ellipse cx="0" cy="9" rx="3.5" ry="7.5" transform="rotate(180 0 9)" fill="#5b92b0" opacity="0.9"/>
        <ellipse cx="-7.79" cy="4.5" rx="3.5" ry="7.5" transform="rotate(240 -7.79 4.5)" fill="#7ba4be" opacity="0.9"/>
        <ellipse cx="-7.79" cy="-4.5" rx="3.5" ry="7.5" transform="rotate(300 -7.79 -4.5)" fill="#5b92b0" opacity="0.9"/>
        <!-- Centro de la flor -->
        <circle cx="0" cy="0" r="3.2" fill="#bae6fd"/>
        <circle cx="0" cy="0" r="1.5" fill="#1e3a8a"/>
    </g>

    <!-- Flor Lateral Izquierda (Más pequeña y sutil) -->
    <g transform="translate(145, 30) scale(0.7)">
        <ellipse cx="0" cy="-8" rx="3" ry="6.5" fill="#7ba4be" opacity="0.9"/>
        <ellipse cx="6.93" cy="-4" rx="3" ry="6.5" transform="rotate(60 6.93 -4)" fill="#5b92b0" opacity="0.9"/>
        <ellipse cx="6.93" cy="4" rx="3" ry="6.5" transform="rotate(120 6.93 4)" fill="#7ba4be" opacity="0.9"/>
        <ellipse cx="0" cy="8" rx="3" ry="6.5" transform="rotate(180 0 8)" fill="#5b92b0" opacity="0.9"/>
        <ellipse cx="-6.93" cy="4" rx="3" ry="6.5" transform="rotate(240 -6.93 4)" fill="#7ba4be" opacity="0.9"/>
        <ellipse cx="-6.93" cy="-4" rx="3" ry="6.5" transform="rotate(300 -6.93 -4)" fill="#5b92b0" opacity="0.9"/>
        <circle cx="0" cy="0" r="2.8" fill="#bae6fd"/>
    </g>

    <!-- Flor Lateral Derecha (Más pequeña y sutil) -->
    <g transform="translate(255, 30) scale(0.7)">
        <ellipse cx="0" cy="-8" rx="3" ry="6.5" fill="#7ba4be" opacity="0.9"/>
        <ellipse cx="6.93" cy="-4" rx="3" ry="6.5" transform="rotate(60 6.93 -4)" fill="#5b92b0" opacity="0.9"/>
        <ellipse cx="6.93" cy="4" rx="3" ry="6.5" transform="rotate(120 6.93 4)" fill="#7ba4be" opacity="0.9"/>
        <ellipse cx="0" cy="8" rx="3" ry="6.5" transform="rotate(180 0 8)" fill="#5b92b0" opacity="0.9"/>
        <ellipse cx="-6.93" cy="4" rx="3" ry="6.5" transform="rotate(240 -6.93 4)" fill="#7ba4be" opacity="0.9"/>
        <ellipse cx="-6.93" cy="-4" rx="3" ry="6.5" transform="rotate(300 -6.93 -4)" fill="#5b92b0" opacity="0.9"/>
        <circle cx="0" cy="0" r="2.8" fill="#bae6fd"/>
    </g>
</svg>
